<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanVibes - 綺麗なまちを後世へ</title>
    <link rel="icon" href="assets/logo-icon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #EDF3F7;
            --paper-2: #F5F9FB;
            --card: #FFFFFF;
            --ink: #0F2A39;
            --ink-2: #15384A;
            --ink-soft: #5C7A88;
            --hair: #E4EDF3;
            --hair-dark: #CDDCE6;
            --teal: #11B5A4;
            --blue: #0EA0E6;
            --lime: #11B5A4;
            --moss: #0E9C8C;
            --moss-soft: #0E9C8C;
            --sky: #E6F6FB;
            --ocean: #0EA0E6;
            --deep: #0B7CC2;
            --green: #11B5A4;
            --white: #FFFFFF;
            --gray-50: #F5F9FB;
            --gray-100: #EAF1F6;
            --gray-200: #DBE6EE;
            --gray-400: #8BA3AF;
            --gray-600: #5C7A88;
            --gray-800: #0F2A39;
            --gold: #E0A52E;
            --silver: #8BA3AF;
            --bronze: #C0743A;
            --danger: #E25563;
            --gradient-main: linear-gradient(135deg, #16C0AE 0%, #0FA2E8 100%);
            --gradient-ink: linear-gradient(135deg, #16C0AE 0%, #0FA2E8 100%);
            --gradient-vivid: linear-gradient(135deg, #16C0AE 0%, #0FA2E8 100%);
            --gradient-card: none;
            --line: #E4EDF3;
            --shadow-sm: 0 1px 2px rgba(15,42,57,0.04), 0 2px 8px rgba(15,42,57,0.05);
            --shadow-md: 0 2px 6px rgba(15,42,57,0.05), 0 10px 26px rgba(15,42,57,0.09);
            --shadow-lg: 0 4px 10px rgba(15,42,57,0.06), 0 18px 44px rgba(15,42,57,0.14);
            --num: 'Oswald', 'Zen Kaku Gothic New', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background: var(--paper); color: var(--ink); min-height: 100vh;
            font-weight: 500; letter-spacing: 0.01em;
            background-image:
                radial-gradient(ellipse at 12% 0%, rgba(17,181,164,0.10) 0%, transparent 46%),
                radial-gradient(ellipse at 92% 6%, rgba(14,160,230,0.10) 0%, transparent 44%);
            background-attachment: fixed;
        }
        ::selection { background: rgba(17,181,164,0.22); color: var(--ink); }

        /* === HEADER === */
        header {
            background: rgba(255,255,255,0.86);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--hair);
        }
        header::after {
            content: ''; display: block; height: 3px; background: var(--gradient-vivid);
        }
        .header-inner { max-width: 1080px; margin: 0 auto; padding: 14px 22px; display: flex; align-items: center; gap: 13px; }
        .header-logo { height: 38px; filter: drop-shadow(0 3px 8px rgba(14,160,230,0.28)); transition: transform 0.3s; }
        .header-logo:hover { transform: scale(1.06) rotate(-4deg); }
        .header-title { font-family: var(--num); font-weight: 600; font-size: 1.34rem; color: var(--ink); letter-spacing: 0.26em; text-transform: uppercase; }
        .header-sub { font-size: 0.58rem; color: var(--teal); font-weight: 700; letter-spacing: 0.32em; margin-top: 1px; }
        .header-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
        .sync-indicator { font-size: 0.66rem; color: var(--gray-400); display: flex; align-items: center; gap: 5px; letter-spacing: 0.08em; }
        .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 7px rgba(17,181,164,0.65); display: inline-block; }
        .sync-dot.loading { background: var(--gold); animation: pulse 1s infinite; }
        .sync-dot.error { background: var(--danger); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .header-count { font-weight: 500; font-size: 0.74rem; color: var(--ink-soft); white-space: nowrap; letter-spacing: 0.08em; }
        .count-num { font-family: var(--num); font-size: 1.38rem; color: transparent; background: var(--gradient-vivid); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600; }

        /* === TABS === */
        .tabs { max-width: 1080px; margin: 0 auto; padding: 26px 22px 18px; display: flex; gap: 10px; }
        .tab {
            padding: 10px 22px; border: 1px solid var(--hair); border-radius: 999px;
            background: var(--card); color: var(--ink-soft);
            font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.04em;
            cursor: pointer; transition: all 0.22s; box-shadow: var(--shadow-sm);
        }
        .tab:hover { color: var(--deep); border-color: rgba(14,160,230,0.4); transform: translateY(-1px); }
        .tab.active { color: #fff; background: var(--gradient-vivid); border-color: transparent; box-shadow: 0 6px 16px rgba(14,160,230,0.32); }
        .bottom-nav { display: none; }
        .main { max-width: 1080px; margin: 0 auto; padding: 0 22px 72px; }
        .panel { background: transparent; border-radius: 0; border: none; padding: 6px 0 0; display: none; }
        .panel.active { display: block; }

        /* === CARDS === */
        .card {
            background: var(--card); border: 1px solid var(--hair); border-radius: 16px;
            padding: 20px; margin-bottom: 12px; transition: all 0.22s; position: relative; box-shadow: var(--shadow-sm);
        }
        .card:hover { border-color: rgba(14,160,230,0.4); box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .card-date {
            font-family: var(--num); font-size: 0.78rem; color: #fff;
            background: var(--gradient-vivid); padding: 3px 12px; border-radius: 999px; white-space: nowrap;
            letter-spacing: 0.08em; font-weight: 500;
        }
        .card-location { font-weight: 700; font-size: 1rem; color: var(--ink); letter-spacing: 0.03em; }
        .card-meta { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.85; }
        .tag {
            display: inline-block; background: var(--sky);
            color: var(--deep); border-radius: 999px; padding: 3px 11px; font-size: 0.73rem;
            font-weight: 700; margin-right: 4px; margin-top: 5px; border: 1px solid rgba(14,160,230,0.18);
            letter-spacing: 0.03em;
        }

        /* === BUTTONS === */
        .edit-btn { background: var(--card); border: 1px solid var(--hair-dark); border-radius: 10px; width: 34px; height: 34px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .edit-btn:hover, .edit-btn:active { border-color: var(--ocean); background: var(--sky); }
        .delete-btn { position: absolute; top: 14px; right: 14px; background: var(--card); border: 1px solid var(--hair-dark); border-radius: 10px; width: 34px; height: 34px; cursor: pointer; font-size: 0.9rem; color: var(--gray-400); transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .delete-btn:hover, .delete-btn:active { border-color: var(--danger); color: var(--danger); background: #FDECEE; }
        .btn { padding: 14px 28px; border: none; border-radius: 12px; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 0.94rem; font-weight: 700; letter-spacing: 0.08em; cursor: pointer; transition: all 0.22s; }
        .btn-primary { background: var(--gradient-vivid); color: #fff; box-shadow: 0 5px 16px rgba(14,160,230,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(14,160,230,0.4); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { background: var(--gray-400); box-shadow: none; cursor: not-allowed; }
        .btn-secondary { background: var(--card); color: var(--ink-soft); border: 1px solid var(--hair-dark); margin-left: 8px; }
        .btn-secondary:hover, .btn-secondary:active { border-color: var(--ocean); color: var(--deep); }

        /* === FORMS === */
        .form-section { margin-bottom: 24px; padding: 24px; background: var(--card); border-radius: 18px; border: 1px solid var(--hair); box-shadow: var(--shadow-sm); }
        .form-title { font-weight: 900; font-size: 1rem; color: var(--ink); margin-bottom: 16px; letter-spacing: 0.06em; padding-bottom: 12px; border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 10px; }
        .form-title::before { content: ''; width: 5px; height: 18px; border-radius: 3px; background: var(--gradient-vivid); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size: 0.74rem; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.1em; }
        input, textarea, select { padding: 12px 14px; border: 1px solid var(--hair-dark); border-radius: 11px; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 0.95rem; color: var(--ink); background: #FBFDFE; outline: none; transition: all 0.22s; }
        input:focus, textarea:focus, select:focus { border-color: var(--ocean); box-shadow: 0 0 0 3px rgba(14,160,230,0.14); }
        textarea { resize: vertical; min-height: 70px; }
        .form-actions { margin-top: 18px; display: flex; }
        .add-toggle-btn {
            width: 100%; padding: 16px; background: var(--card); border: 1.5px dashed rgba(14,160,230,0.5);
            border-radius: 14px; color: var(--deep); font-family: 'Zen Kaku Gothic New', sans-serif;
            font-weight: 700; font-size: 0.94rem; letter-spacing: 0.08em; cursor: pointer; margin-bottom: 14px; transition: all 0.22s;
        }
        .add-toggle-btn:hover, .add-toggle-btn:active { background: var(--sky); border-style: solid; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        .checkbox-label { display: inline-flex; align-items: center; gap: 5px; background: var(--card); border: 1px solid var(--hair-dark); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-size: 0.88rem; transition: all 0.2s; color: var(--ink-soft); }
        .checkbox-label:has(input:checked) { border-color: transparent; background: var(--gradient-vivid); color: #fff; font-weight: 700; box-shadow: 0 4px 12px rgba(14,160,230,0.28); }
        .checkbox-label input { display: none; }

        /* === STATS === */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 26px; }
        .stat-card {
            background: var(--card); border: 1px solid var(--hair); border-radius: 18px;
            padding: 24px 14px 20px; text-align: center; transition: all 0.22s;
            box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
        }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gradient-vivid); }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-num { font-family: var(--num); font-size: 2.5rem; font-weight: 600; color: var(--ink); line-height: 1.05; letter-spacing: 0.01em; }
        .stat-label { font-size: 0.7rem; color: var(--ink-soft); margin-top: 9px; font-weight: 700; letter-spacing: 0.1em; }

        /* === RANKING === */
        .ranking-title { font-weight: 900; font-size: 1.05rem; color: var(--ink); margin: 14px 0 18px; letter-spacing: 0.08em; padding-bottom: 12px; border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 10px; }
        .ranking-title::before { content: ''; width: 5px; height: 18px; border-radius: 3px; background: var(--gradient-vivid); }
        .rank-item { display: flex; align-items: center; gap: 12px; padding: 15px 18px; background: var(--card); border-radius: 14px; margin-bottom: 8px; border: 1px solid var(--hair); transition: all 0.22s; box-shadow: var(--shadow-sm); }
        .rank-item:hover { border-color: rgba(14,160,230,0.4); box-shadow: var(--shadow-md); transform: translateX(2px); }
        .rank-badge { font-family: var(--num); font-size: 1.2rem; font-weight: 600; width: 30px; text-align: center; }
        .rank-1 { color: var(--gold); } .rank-2 { color: var(--silver); } .rank-3 { color: var(--bronze); } .rank-n { color: var(--gray-400); font-size: 0.85rem; }
        .rank-name { font-weight: 700; color: var(--ink); letter-spacing: 0.03em; }
        .rank-count { font-family: var(--num); font-weight: 600; color: var(--deep); font-size: 1.3rem; }
        .rank-item-inner { flex: 1; }
        .rank-bar-bg { height: 4px; background: var(--gray-100); border-radius: 999px; margin-top: 6px; overflow: hidden; }
        .rank-bar { height: 4px; background: var(--gradient-vivid); border-radius: 999px; transition: width 0.8s ease; }

        /* === CHARACTER SYSTEM === */
        .rank-character { display: flex; align-items: center; gap: 5px; }
        .character-display { font-size: 1.5rem; line-height: 1; }
        .character-level { font-size: 0.58rem; color: var(--moss); font-weight: 700; background: var(--sky); border: 1px solid rgba(17,181,164,0.2); padding: 2px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: 0.04em; }

        /* Character Card in Members Panel */
        .member-card {
            background: var(--card); border: 1px solid var(--hair); border-radius: 16px;
            padding: 20px 16px; text-align: center; transition: all 0.22s; min-width: 140px; box-shadow: var(--shadow-sm);
        }
        .member-card:hover { border-color: rgba(14,160,230,0.4); box-shadow: var(--shadow-md); transform: translateY(-3px); }
        .member-card .char-avatar { font-size: 2.5rem; margin-bottom: 8px; display: block; animation: float 3s ease-in-out infinite; }
        .member-card .char-name { font-weight: 700; font-size: 0.98rem; color: var(--ink); margin-bottom: 3px; letter-spacing: 0.04em; }
        .member-card .char-title { font-size: 0.64rem; color: var(--teal); font-weight: 700; margin-bottom: 7px; letter-spacing: 0.06em; }
        .member-card .char-count { font-family: var(--num); font-size: 0.92rem; color: var(--deep); letter-spacing: 0.02em; }
        .member-card .char-bar { height: 4px; background: var(--gray-100); border-radius: 999px; margin-top: 10px; overflow: hidden; }
        .member-card .char-bar-fill { height: 4px; background: var(--gradient-vivid); border-radius: 999px; transition: width 0.8s; }
        .member-card .char-next { font-size: 0.58rem; color: var(--gray-400); margin-top: 6px; letter-spacing: 0.03em; }
        .member-card .delete-member-btn { background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 0.68rem; margin-top: 7px; transition: color 0.2s; }
        .member-card .delete-member-btn:hover, .member-card .delete-member-btn:active { color: var(--danger); }
        .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* === MY CHARACTER (Header area for Members) === */
        .character-showcase {
            background: var(--gradient-vivid);
            border: none; border-radius: 20px; padding: 32px 26px; margin-bottom: 24px;
            text-align: center; position: relative; overflow: hidden; box-shadow: 0 12px 34px rgba(14,160,230,0.3);
        }
        .character-showcase::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.16), transparent, rgba(255,255,255,0.12), transparent);
            animation: spin 22s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .showcase-content { position: relative; z-index: 1; }
        .showcase-char { font-size: 3.6rem; display: block; margin-bottom: 12px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.18)); }
        .showcase-title { font-weight: 900; font-size: 1.12rem; color: #fff; letter-spacing: 0.12em; }
        .showcase-subtitle { font-size: 0.78rem; color: rgba(255,255,255,0.85); margin-top: 6px; letter-spacing: 0.06em; }

        /* === ACTIVITY HEATMAP === */
        .heatmap-section { margin-top: 26px; padding: 22px; background: var(--card); border-radius: 18px; border: 1px solid var(--hair); box-shadow: var(--shadow-sm); }
        .heatmap-title { font-weight: 900; font-size: 0.95rem; color: var(--ink); margin-bottom: 14px; letter-spacing: 0.06em; }
        .heatmap-months { display: flex; gap: 2px; overflow-x: auto; padding-bottom: 8px; }
        .heatmap-month { text-align: center; }
        .heatmap-month-label { font-size: 0.6rem; color: var(--gray-400); margin-bottom: 4px; font-family: var(--num); }
        .heatmap-weeks { display: flex; gap: 2px; }
        .heatmap-week { display: flex; flex-direction: column; gap: 2px; }
        .heatmap-day {
            width: 12px; height: 12px; border-radius: 3px; background: var(--gray-100);
            transition: all 0.2s; cursor: default;
        }
        .heatmap-day.level-1 { background: #B6EAF0; }
        .heatmap-day.level-2 { background: #62D2CC; }
        .heatmap-day.level-3 { background: #1FB6C4; }
        .heatmap-day.level-4 { background: #0E8FB0; }
        .heatmap-day:hover { transform: scale(1.4); box-shadow: var(--shadow-sm); }
        .heatmap-legend { display: flex; align-items: center; gap: 4px; margin-top: 10px; justify-content: flex-end; font-size: 0.6rem; color: var(--gray-400); }
        .heatmap-legend-box { width: 10px; height: 10px; border-radius: 2px; }

        /* === ENCOURAGEMENT / MESSAGE === */
        .encourage-section { margin-top: 26px; padding: 22px; background: var(--card); border: 1px solid var(--hair); border-left: 4px solid var(--teal); border-radius: 14px; box-shadow: var(--shadow-sm); }
        .encourage-title { font-weight: 900; font-size: 0.95rem; color: var(--ink); margin-bottom: 12px; letter-spacing: 0.06em; }
        .encourage-msg { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.95; }
        .encourage-msg strong { color: var(--deep); font-weight: 700; }

        /* === PHOTOS === */
        .photo-input-area { margin-top: 8px; }
        .photo-input-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid rgba(14,160,230,0.5); border-radius: 11px; padding: 10px 18px; color: var(--deep); font-weight: 700; font-size: 0.86rem; letter-spacing: 0.04em; cursor: pointer; transition: all 0.22s; }
        .photo-input-btn:hover, .photo-input-btn:active { background: var(--sky); transform: translateY(-1px); }
        .photo-input-btn input { display: none; }
        .photo-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .photo-preview-item { position: relative; width: 80px; height: 80px; border-radius: 11px; overflow: hidden; border: 1px solid var(--hair-dark); }
        .photo-preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .photo-preview-item .remove-photo { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; background: rgba(15,42,57,0.78); color: #fff; border: none; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .photo-grid img { width: 124px; height: 92px; object-fit: cover; border-radius: 11px; cursor: pointer; transition: all 0.22s; border: 1px solid var(--hair); }
        .photo-grid img:hover { transform: scale(1.05); border-color: var(--ocean); box-shadow: var(--shadow-md); }
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,24,33,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .lightbox img { max-width: 95%; max-height: 90vh; border-radius: 8px; object-fit: contain; }
        .lightbox-close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; background: none; border: none; }
        .upload-progress { margin-top: 8px; font-size: 0.78rem; color: var(--deep); font-weight: 700; letter-spacing: 0.04em; }

        /* === MISC === */
        .empty { text-align: center; padding: 52px 20px; color: var(--gray-400); }
        .empty-icon { font-size: 2.8rem; margin-bottom: 12px; opacity: 0.7; }
        .empty-text { font-size: 0.88rem; line-height: 1.95; letter-spacing: 0.03em; }
        .toast { position: fixed; bottom: 26px; right: 26px; background: var(--gradient-vivid); color: #fff; padding: 14px 24px; border-radius: 13px; font-weight: 700; font-size: 0.88rem; letter-spacing: 0.04em; transform: translateY(80px); opacity: 0; transition: all 0.45s cubic-bezier(0.22,1,0.36,1); z-index: 1000; box-shadow: 0 10px 30px rgba(14,160,230,0.4); pointer-events: none; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .member-add-row { display: flex; gap: 8px; margin-bottom: 16px; }
        .member-add-row input { flex: 1; }

        /* === ROADMAP / COUNTERS (Top of Records) === */
        .top-counters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .counter-card {
            background: var(--card); border: 1px solid var(--hair); border-radius: 16px;
            padding: 22px 10px 18px; text-align: center; position: relative; overflow: hidden;
            transition: all 0.22s; box-shadow: var(--shadow-sm);
        }
        .counter-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gradient-vivid); }
        .counter-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .counter-icon { font-size: 1.2rem; line-height: 1; }
        .counter-label { font-size: 0.66rem; color: var(--ink-soft); font-weight: 700; margin-top: 8px; letter-spacing: 0.1em; }
        .counter-num { font-family: var(--num); font-size: 2.5rem; font-weight: 600; color: var(--ink); line-height: 1.05; margin-top: 4px; letter-spacing: 0.01em; }
        .counter-unit { font-size: 0.64rem; color: var(--gray-400); letter-spacing: 0.08em; margin-top: 2px; }
        .counter-card.highlight { background: var(--gradient-vivid); border-color: transparent; box-shadow: 0 12px 30px rgba(14,160,230,0.32); }
        .counter-card.highlight::before { display: none; }
        .counter-card.highlight .counter-icon { filter: brightness(0) invert(1); opacity: 0.92; }
        .counter-card.highlight .counter-num { color: #fff; }
        .counter-card.highlight .counter-label { color: rgba(255,255,255,0.88); }
        .counter-card.highlight .counter-unit { color: rgba(255,255,255,0.7); }
        /* 通算（先頭カード）はソリッドのダーク・ティールで実績を別格に */
        .top-counters .counter-card.highlight:first-child { background: var(--ink); }

        .roadmap-card {
            background: var(--card);
            border: 1px solid var(--hair);
            border-radius: 16px; padding: 18px; margin-bottom: 16px; position: relative; overflow: hidden; box-shadow: var(--shadow-sm);
        }
        .roadmap-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .roadmap-title { font-weight: 900; font-size: 0.95rem; color: var(--ink); display: flex; align-items: center; gap: 6px; letter-spacing: 0.04em; }
        .roadmap-status { font-size: 0.7rem; color: var(--teal); font-weight: 700; background: var(--sky); padding: 4px 12px; border-radius: 999px; letter-spacing: 0.04em; }
        .roadmap-track-wrap { position: relative; padding: 18px 0 6px; }
        .roadmap-track { height: 6px; background: var(--gray-100); border-radius: 999px; position: relative; }
        .roadmap-progress { height: 100%; background: var(--gradient-vivid); border-radius: 999px; transition: width 1s ease; position: relative; }
        .roadmap-progress::after { content: ''; position: absolute; top: 0; right: -2px; bottom: 0; width: 4px; border-radius: 999px; background: rgba(255,255,255,0.9); box-shadow: 0 0 8px rgba(14,160,230,0.6); }
        .roadmap-marker {
            position: absolute; top: 2px;
            font-size: 1.4rem; line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12));
            animation: bob 2s ease-in-out infinite;
        }
        @keyframes bob {
            0%,100% { transform: translate(-50%, 0) scaleX(-1); }
            50%     { transform: translate(-50%, -4px) scaleX(-1); }
        }
        .roadmap-goal { position: absolute; right: -2px; top: 2px; font-size: 1.1rem; line-height: 1; }
        .roadmap-months { display: grid; grid-template-columns: repeat(12, 1fr); margin-top: 10px; font-size: 0.62rem; color: var(--gray-400); font-weight: 500; text-align: center; font-family: var(--num); }
        .roadmap-month.current { color: var(--deep); font-weight: 700; }
        .roadmap-month.past { color: var(--teal); }
        .roadmap-msg { font-size: 0.78rem; color: var(--ink-soft); margin-top: 10px; line-height: 1.8; text-align: center; letter-spacing: 0.02em; }
        .roadmap-msg strong { color: var(--ink); font-weight: 700; }

        /* === ENVIRONMENTAL IMPACT === */
        .impact-section { margin-top: 26px; padding: 22px; background: var(--card); border: 1px solid var(--hair); border-left: 4px solid var(--green); border-radius: 14px; box-shadow: var(--shadow-sm); }
        .impact-title { font-weight: 900; font-size: 0.95rem; color: var(--ink); margin-bottom: 14px; letter-spacing: 0.06em; }
        .impact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .impact-item { text-align: center; padding: 16px 8px; background: var(--paper-2); border: 1px solid var(--hair); border-radius: 12px; }
        .impact-num { font-family: var(--num); font-size: 1.6rem; font-weight: 600; color: var(--green); }
        .impact-label { font-size: 0.64rem; color: var(--ink-soft); margin-top: 4px; font-weight: 700; letter-spacing: 0.06em; }

        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* === MOBILE === */
        @media (max-width: 640px) {
            .header-inner { padding: 12px 16px; gap: 9px; }
            .header-logo { height: 32px; }
            .header-title { font-size: 1.1rem; letter-spacing: 0.2em; }
            .header-sub { display: none; }
            .header-count { font-size: 0.68rem; }
            .count-num { font-size: 1.15rem; }
            .tabs { display: none; }
            .main { padding: 16px 14px 96px; }
            .panel { padding: 0; }
            .bottom-nav {
                display: flex; position: fixed; bottom: 0; left: 0; right: 0;
                background: rgba(255,255,255,0.94);
                backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
                border-top: 1px solid var(--hair);
                z-index: 200; box-shadow: 0 -6px 24px rgba(15,42,57,0.08);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .bottom-nav button { flex: 1; padding: 10px 2px 12px; background: none; border: none; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; color: var(--gray-400); cursor: pointer; transition: color 0.2s; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 58px; position: relative; -webkit-tap-highlight-color: transparent; }
            .bottom-nav button .nav-icon { font-size: 1.32rem; line-height: 1; transition: transform 0.2s; }
            .bottom-nav button:active { color: var(--deep); }
            .bottom-nav button.active { color: var(--deep); }
            .bottom-nav button.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--gradient-vivid); }
            .bottom-nav button.active .nav-icon { transform: scale(1.12); }
            input, textarea, select { font-size: 1rem; padding: 12px 14px; }
            .form-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .impact-grid { grid-template-columns: 1fr 1fr 1fr; }
            .stat-card { padding: 18px 8px 16px; } .stat-num { font-size: 1.9rem; } .stat-label { font-size: 0.6rem; letter-spacing: 0.06em; }
            .btn { padding: 14px 18px; font-size: 0.94rem; }
            .add-toggle-btn { padding: 16px; font-size: 0.92rem; }
            .form-section { padding: 18px 16px; }
            .delete-btn { width: 38px; height: 38px; }
            .member-add-row { flex-direction: column; }
            .member-add-row .btn { width: 100%; }
            .toast { bottom: 88px; right: 14px; left: 14px; text-align: center; }
            .checkbox-label { padding: 10px 16px; font-size: 0.88rem; }
            .member-grid { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
            .member-card { padding: 16px 10px; min-width: auto; }
            .member-card .char-avatar { font-size: 2rem; }
            .card { padding: 16px; overflow: hidden; } .card-meta { font-size: 0.85rem; word-break: break-word; overflow-wrap: anywhere; }
            .card-location { font-size: 0.96rem; word-break: break-word; }
            .card-header { gap: 7px; }
            .photo-grid img { width: 92px; height: 70px; }
            .heatmap-day { width: 10px; height: 10px; }
            .support-card { gap: 8px; padding: 14px; }
            .support-name { font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
            .support-detail { font-size: 0.75rem; word-break: break-word; }
            .support-card { flex-wrap: wrap; gap: 8px; }
            .support-amount { font-size: 0.92rem; width: 100%; padding-left: 38px; margin-top: -4px; }
            .support-icon { font-size: 1.4rem; }
            .support-date { font-size: 0.64rem; }
            .rank-item { padding: 14px 14px; gap: 9px; }
            .rank-name { font-size: 0.92rem; word-break: break-word; }
            .character-level { font-size: 0.54rem; }
            .top-counters { gap: 8px; }
            .counter-card { padding: 16px 4px 13px; }
            .counter-num { font-size: 1.8rem; }
            .counter-label { font-size: 0.56rem; letter-spacing: 0.08em; }
            .counter-unit { font-size: 0.56rem; }
            .counter-icon { font-size: 1rem; }
            .roadmap-card { padding: 14px; }
            .roadmap-title { font-size: 0.85rem; }
            .roadmap-status { font-size: 0.62rem; padding: 3px 9px; }
            .roadmap-months { font-size: 0.55rem; }
            .roadmap-month.current { font-size: 0.62rem; }
            .roadmap-msg { font-size: 0.72rem; }
        }

        /* === MODAL === */
        #edit-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,24,33,0.5); z-index: 300; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card); border-radius: 18px; border: 1px solid var(--hair); padding: 26px; max-width: 520px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }

        /* === SUPPORT & ACCOUNTING === */
        .support-card {
            background: var(--card); border: 1px solid var(--hair); border-radius: 14px;
            padding: 16px 18px; margin-bottom: 8px; transition: all 0.22s;
            display: flex; align-items: center; gap: 14px;
            position: relative; box-shadow: var(--shadow-sm);
        }
        .support-card:hover { border-color: rgba(14,160,230,0.4); box-shadow: var(--shadow-md); }
        .support-icon { font-size: 1.6rem; flex-shrink: 0; }
        .support-info { flex: 1; min-width: 0; }
        .support-name { font-weight: 700; font-size: 0.98rem; color: var(--ink); letter-spacing: 0.03em; }
        .support-detail { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; word-break: break-word; line-height: 1.7; }
        .support-date { font-family: var(--num); font-size: 0.72rem; color: var(--gray-400); white-space: nowrap; letter-spacing: 0.04em; }
        .support-amount { font-weight: 700; font-size: 0.95rem; word-break: break-word; }
        .support-amount.income { font-family: var(--num); color: var(--deep); white-space: nowrap; font-size: 1.15rem; letter-spacing: 0.02em; }
        .support-amount.item { color: var(--teal); }
        .support-delete { background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 0.8rem; padding: 4px; transition: color 0.2s; flex-shrink: 0; }
        .support-delete:hover, .support-delete:active { color: var(--danger); }
        .support-summary {
            background: var(--card); border: 1px solid var(--hair);
            border-radius: 18px; padding: 26px 24px; margin-bottom: 16px; text-align: center;
            position: relative; overflow: hidden; box-shadow: var(--shadow-sm);
        }
        .support-summary::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gradient-vivid); }
        .support-summary-title { font-weight: 900; font-size: 1rem; color: var(--ink); margin-bottom: 18px; letter-spacing: 0.08em; padding-bottom: 14px; border-bottom: 1px solid var(--hair); }
        .support-summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .support-summary-item { padding: 16px 10px; background: var(--paper-2); border-radius: 12px; border: 1px solid var(--hair); }
        .support-summary-num { font-family: var(--num); font-size: 1.65rem; font-weight: 600; color: var(--ink); letter-spacing: 0.01em; }
        .support-summary-label { font-size: 0.62rem; color: var(--ink-soft); font-weight: 700; margin-top: 6px; letter-spacing: 0.08em; }
        .support-summary-item.total {
            grid-column: 1 / -1; background: var(--gradient-vivid);
            border: none; padding: 22px 16px; box-shadow: 0 10px 26px rgba(14,160,230,0.3);
            position: relative; overflow: hidden;
        }
        .support-summary-item.total::after { content: ''; position: absolute; top: 0; left: -60%; width: 50%; height: 100%; background: linear-gradient(105deg, transparent, rgba(255,255,255,0.22), transparent); animation: shimmer 3.5s ease-in-out infinite; }
        .support-summary-item.total .support-summary-num { color: #fff; font-size: 2.3rem; }
        .support-summary-item.total .support-summary-label { color: rgba(255,255,255,0.9); font-weight: 700; font-size: 0.66rem; letter-spacing: 0.14em; }

        .accounting-table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--hair); margin-bottom: 18px; box-shadow: var(--shadow-sm); }
        .accounting-table th { background: var(--gradient-vivid); color: #fff; padding: 12px; font-size: 0.74rem; font-weight: 700; text-align: left; letter-spacing: 0.06em; }
        .accounting-table td { padding: 11px 12px; font-size: 0.85rem; border-top: 1px solid var(--hair); background: var(--card); }
        .accounting-table tr:hover td { background: var(--paper-2); }
        .accounting-table .amount-in { color: var(--teal); font-weight: 700; font-family: var(--num); letter-spacing: 0.02em; }
        .accounting-table .amount-out { color: var(--danger); font-weight: 700; font-family: var(--num); letter-spacing: 0.02em; }
        .accounting-balance {
            background: var(--card); border: 1px solid var(--hair); border-left: 4px solid var(--teal);
            border-radius: 14px; padding: 20px 22px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }
        .balance-label { font-weight: 900; font-size: 1rem; color: var(--ink); letter-spacing: 0.06em; }
        .balance-amount { font-family: var(--num); font-size: 1.9rem; font-weight: 600; color: var(--deep); letter-spacing: 0.01em; }
        .accounting-filter { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        .accounting-filter button {
            padding: 8px 18px; border: 1px solid var(--hair-dark); border-radius: 999px;
            background: var(--card); font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-soft); cursor: pointer; transition: all 0.2s;
        }
        .accounting-filter button.active { border-color: transparent; background: var(--gradient-vivid); color: #fff; }
        .accounting-filter button:hover, .accounting-filter button:active { border-color: var(--ocean); color: var(--deep); }
        .accounting-filter button.active:hover { color: #fff; }
        @media (max-width: 640px) {
            .support-summary-grid { grid-template-columns: 1fr 1fr; }
            .accounting-table { font-size: 0.74rem; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .accounting-table th, .accounting-table td { padding: 8px 6px; white-space: nowrap; }
            .accounting-table td:nth-child(3) { white-space: normal; word-break: break-word; max-width: 120px; }
            .accounting-balance { flex-direction: column; gap: 6px; text-align: center; }
            .balance-amount { font-size: 1.5rem; }
        }

        /* === BEFORE / AFTER PAIRS === */
        .pair-row { background: var(--paper-2); border: 1px solid var(--hair); border-radius: 12px; padding: 12px; margin-bottom: 10px; position: relative; }
        .pair-row-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .pair-row-head input { flex: 1; padding: 9px 12px; font-size: 0.88rem; }
        .pair-remove { background: none; border: 1px solid var(--hair-dark); border-radius: 8px; width: 32px; height: 32px; color: var(--gray-400); cursor: pointer; flex-shrink: 0; }
        .pair-remove:hover, .pair-remove:active { border-color: var(--danger); color: var(--danger); }
        .pair-slots { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
        .pair-slot { border: 1.5px dashed var(--hair-dark); border-radius: 10px; min-height: 92px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; background: var(--card); transition: border-color 0.2s; }
        .pair-slot:hover, .pair-slot:active { border-color: var(--ocean); }
        .pair-slot img { width: 100%; height: 92px; object-fit: cover; display: block; }
        .pair-slot-label { font-size: 0.72rem; color: var(--gray-400); font-weight: 700; text-align: center; line-height: 1.6; }
        .pair-arrow { font-size: 1.1rem; color: var(--teal); font-weight: 700; }
        .pair-badge { position: absolute; top: 4px; left: 4px; font-size: 0.6rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: #fff; letter-spacing: 0.06em; z-index: 2; }
        .pair-badge.before { background: rgba(15,42,57,0.75); }
        .pair-badge.after { background: var(--gradient-vivid); }
        .pair-add-btn { width: 100%; padding: 11px; background: var(--card); border: 1.5px dashed rgba(17,181,164,0.55); border-radius: 12px; color: var(--moss); font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; font-size: 0.86rem; cursor: pointer; transition: all 0.2s; }
        .pair-add-btn:hover, .pair-add-btn:active { background: var(--sky); border-style: solid; }
        /* 記録カード内のBefore/After表示 */
        .card-pairs { margin-top: 10px; }
        .card-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; margin-top: 8px; }
        .card-pair-label { grid-column: 1 / -1; font-size: 0.72rem; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.04em; }
        .card-pair .ph { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--hair); }
        .card-pair .ph img { width: 100%; height: 110px; object-fit: cover; display: block; cursor: pointer; }
        @media (max-width: 640px) { .card-pair .ph img { height: 96px; } .pair-slot img { height: 84px; } .pair-slot { min-height: 84px; } }

        /* === FOOTER === */
        .app-footer { max-width: 1080px; margin: 0 auto; padding: 38px 22px 32px; text-align: center; border-top: 1px solid var(--hair); margin-top: 24px; }
        .footer-logo { height: 46px; opacity: 0.6; margin-bottom: 10px; }
        .footer-text { font-size: 0.64rem; color: var(--gray-400); letter-spacing: 0.18em; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <img src="assets/logo-icon.png" alt="CleanVibes" class="header-logo">
            <div>
                <div class="header-title">CleanVibes</div>
                <div class="header-sub">綺麗なまちを後世へ</div>
            </div>
            <div class="header-right">
                <button id="admin-btn" onclick="toggleAdmin()" style="display:none;">管理者</button>
                <div class="sync-indicator">
                    <span id="sync-label">同期済み</span>
                    <span id="sync-dot" class="sync-dot"></span>
                </div>
                <div class="header-count">今年 <span id="header-count" class="count-num">0</span> 回</div>
            </div>
        </div>
    </header>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('records')">活動記録</button>
        <button class="tab" onclick="switchTab('stats')">集計</button>
        <button class="tab" onclick="switchTab('members')">メンバー</button>
        <button class="tab" onclick="switchTab('support')">支援</button>
        <button class="tab" onclick="switchTab('accounting')">経理</button>
    </div>

    <div class="main">
        <!-- Records Panel -->
        <div id="panel-records" class="panel active">
            <div id="top-counters-area"></div>
            <div id="home-support-area" style="margin-bottom: 14px;"></div>
            <div style="margin-bottom: 14px; display: flex; gap: 8px;">
                <button id="add-toggle" onclick="toggleAddForm()" class="add-toggle-btn">+ 記録を追加</button>
                <button id="sort-btn" onclick="toggleSort()" style="background: var(--ink); color: #fff; border: none; border-radius: 12px; padding: 12px 20px; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; letter-spacing: 0.08em; cursor: pointer; transition: all 0.22s; white-space: nowrap; flex-shrink: 0;">新しい順</button>
                <button id="report-btn" onclick="openReportModal()" style="background: var(--gradient-vivid); color: #fff; border: none; border-radius: 12px; padding: 12px 20px; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; transition: all 0.22s; white-space: nowrap; flex-shrink: 0; box-shadow: 0 4px 12px rgba(14,160,230,0.28);">📄 報告書</button>
            </div>
            <form id="add-form" style="display: none;">
                <div class="form-section">
                    <div class="form-title">活動記録を追加</div>
                    <div class="form-grid">
                        <div class="form-group"><label>日時 *</label><input id="f-date" type="date" required></div>
                        <div class="form-group"><label>場所 *</label><input id="f-place" type="text" list="dl-place" placeholder="例: 〇〇公園" required></div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group full"><label>参加メンバー *</label><div id="member-checkboxes" class="checkbox-group"></div></div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group full"><label>作業内容 *</label><textarea id="f-work" placeholder="清掃内容を記入してください" required></textarea></div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group full"><label>その他（メモ）</label><textarea id="f-memo" placeholder="特記事項があればここに記入"></textarea></div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group full"><label>可燃物の回収場所（行政報告用）</label><input id="f-combustible" type="text" list="dl-combustible" placeholder="例: 伊豆伊東高校スロープ手前"></div>
                        <div class="form-group full"><label>土砂の回収場所（行政報告用）</label><input id="f-soil" type="text" list="dl-soil" placeholder="例: 〇〇交差点脇に土嚢袋で仮置き"></div>
                        <div class="form-group full"><label>回収量（行政報告用）</label><input id="f-bags" type="text" placeholder="例: ガラ袋3袋・土嚢袋2袋"></div>
                        <div class="form-group full"><label>作業範囲（行政報告用）</label><input id="f-area" type="text" placeholder="例: 〇〇交差点～△△バス停 約200m"></div>
                        <div class="form-group full"><label>支給材料の使用量（行政報告用）</label><input id="f-material" type="text" placeholder="例: マサファルト3袋半 使用"></div>
                        <div class="form-group full"><label>防草の工程・材料（行政報告用）</label><textarea id="f-weeding" placeholder="例: モルタル／散水パッチ／固まる砂による防草。物理除去→焼却→発芽抑制→アルカリ水散布"></textarea></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyCHg6qLzpttcBDAAiAIFxBCreZ4ZVk0WdEQ-YVGNWMKYooWY4Wgsti2gGWSdZTRvVK0Q/exec';

        let state = { records: [], members: [], supports: [], accounting: [] };
        let editingId = null;
        let sortOrder = 'desc';
        const ADMIN_PASSWORD = 'Clean Vibes';
        const DELETE_PASSWORD = '0325';
        let isAdmin = true;
        let pendingPhotos = [];      // 作業の様子
        let pendingPhotosDone = [];  // 完成写真
        let pendingPhotosGov = [];   // 行政に対応依頼箇所
        let editPendingPhotos = [];
        let editPendingPhotosDone = [];
        let editPendingPhotosGov = [];
        let editExistingPhotos = [];
        let editExistingPhotosDone = [];
        let editExistingPhotosGov = [];

        // 写真カテゴリ共通ヘルパー（key=record上のフィールド名）
        var PH_CATS = ['photos', 'photosDone', 'photosGov'];
        var PH_LABELS = { photos: '作業の様子', photosDone: '完成写真', photosGov: '行政に対応依頼箇所' };
        function phSuffix(cat) { return cat === 'photosDone' ? '-done' : cat === 'photosGov' ? '-gov' : ''; }
        function phPending(cat) { return cat === 'photosDone' ? pendingPhotosDone : cat === 'photosGov' ? pendingPhotosGov : pendingPhotos; }
        function phEditPending(cat) { return cat === 'photosDone' ? editPendingPhotosDone : cat === 'photosGov' ? editPendingPhotosGov : editPendingPhotos; }
        function phEditExisting(cat) { return cat === 'photosDone' ? editExistingPhotosDone : cat === 'photosGov' ? editExistingPhotosGov : editExistingPhotos; }
        let pendingPairs = [];   // 追加フォームのBefore/After（{label, before:{data|url}, after:{data|url}}）
        let editPairs = [];      // 編集モーダルのBefore/After

        // ==========================================
        // 活動回数オフセット（アプリ導入前の実績を加算）
        // ==========================================
        const TOTAL_HISTORY_OFFSET      = 409; // 通算（個人活動も含む全期間）= 33 + 409 = 442
        const CLEANVIBES_HISTORY_OFFSET = 392; // CleanVibes結成以降の通算       = 33 + 392 = 425

        // 今年の延べ参加人数への加算分（記録に含まれない参加者を手動補正）
        const OHTAKE_2026_COUNT       = 48; // 大竹はランキング除外だが毎回参加。今年の参加回数
        const GUEST_PARTICIPANTS_2026 = 10; // 飛び入り・一般参加者の概算

        // ボランティア人件費換算の前提
        const AVG_ACTIVITY_MINUTES  = 90;   // 1回あたり平均活動時間（分）
        const VOLUNTEER_HOURLY_WAGE = 1300; // ボランティア1人あたり時給（円）

        // アプリ導入前（通算オフセット409回分）の延べ参加人数の概算
        const HISTORY_PHASE1_COUNT = 300; const HISTORY_PHASE1_AVG = 3; // 1〜300回目: 平均3人
        const HISTORY_PHASE2_COUNT = 109; const HISTORY_PHASE2_AVG = 4; // 301〜409回目: 平均4人

        // ==========================================
        // メンバー名の表示（敬称付け／別名）
        // データ上の名前は変更せず、表示時のみ変換する
        // ==========================================
        const MEMBER_DISPLAY_ALIAS = { '山川奥様': '美恵' }; // 別名（旧名→表示名）
        const HONORIFIC_SUFFIXES   = ['さん', 'ちゃん', 'くん', '君', '様', '市議', '議員', '先生', '氏']; // 既に敬称/肩書が付く名前は「さん」を足さない
        function displayName(name) {
            var n = MEMBER_DISPLAY_ALIAS[name] || name;
            for (var i = 0; i < HONORIFIC_SUFFIXES.length; i++) {
                var suf = HONORIFIC_SUFFIXES[i];
                if (n.length >= suf.length && n.slice(-suf.length) === suf) return n;
            }
            return n + 'さん';
        }

        // 指定年の延べ参加人数 = 記録上の延べ人数（大竹除く）+ 大竹 + 飛び入り
        function getYearlyParticipantTotal(yearRecords) {
            var exclude = ['大竹'];
            var n = 0;
            yearRecords.forEach(function(r) { r.members.forEach(function(m) { if (exclude.indexOf(m) === -1) n++; }); });
            return n + OHTAKE_2026_COUNT + GUEST_PARTICIPANTS_2026;
        }

        // 延べ参加人数 × 1回の活動時間 × 時給 ＝ 人件費換算
        function getLaborCost(participantTotal) {
            return Math.round(participantTotal * (AVG_ACTIVITY_MINUTES / 60) * VOLUNTEER_HOURLY_WAGE);
        }

        // アプリ導入前の延べ参加人数の概算（1〜300回×3人 + 301〜409回×4人）
        function getHistoricalParticipantTotal() {
            return HISTORY_PHASE1_COUNT * HISTORY_PHASE1_AVG + HISTORY_PHASE2_COUNT * HISTORY_PHASE2_AVG;
        }

        // ==========================================
        // CHARACTER GROWTH SYSTEM
        // ==========================================
        const CHARACTER_LEVELS = [
            { min: 0,  emoji: '🧹', title: 'はじめの一歩',   desc: 'まちの美化に踏み出した！', nextAt: 3 },
            { min: 3,  emoji: '🧤', title: 'おそうじ見習い', desc: '仲間と汗を流し始めた！', nextAt: 6 },
            { min: 6,  emoji: '🪣', title: 'まち美化サポーター', desc: '道具を持って駆けつける！', nextAt: 10 },
            { min: 10, emoji: '🌿', title: 'グリーンキーパー', desc: '緑を守る頼れる存在！', nextAt: 15 },
            { min: 15, emoji: '💪', title: '美化リーダー',   desc: 'みんなを引っ張る存在！', nextAt: 20 },
            { min: 20, emoji: '🌊', title: 'まちの守り手',   desc: '街全体を綺麗にする力！', nextAt: 30 },
            { min: 30, emoji: '🏅', title: '奉仕の達人',     desc: '活動を積み重ねた匠！', nextAt: 50 },

        // 保存後の検証用にクラウドの現状を読み直す(JSONP)
        function fetchCloudSnapshot() {
            return new Promise(function(res, rej) {
                var cb = 'vf_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5);
                var s = document.createElement('script');
                var timer = setTimeout(function() { cleanup(); rej(0); }, 15000);
                function cleanup() { clearTimeout(timer); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
                window[cb] = function(data) { cleanup(); res(data); };
                s.src = GAS_URL + '?callback=' + cb + '&t=' + Date.now();
                s.onerror = function() { cleanup(); rej(0); };
                document.head.appendChild(s);
            });
        }

        // 保存は直列化する（裏の写真送信完了時の保存と通常保存が同時に走っても、
        // 到着順の逆転で古いデータが後勝ちしないようにするため）。
        // さらに: no-corsのPOSTは成否が見えず「保存できたつもりでデータが消える」
        // 事故が実際に起きたため、保存後に読み直してrevが一致するか検証し、
        // 不一致なら最大3回まで自動再送、それでも失敗なら明確に警告する。
        var _saveInFlight = false, _saveQueued = false;
        async function saveToCloud() {
            if (_saveInFlight) { _saveQueued = true; return; }
            _saveInFlight = true;
            setSyncStatus('loading');
            var okSave = false;
            for (var attempt = 0; attempt < 3 && !okSave; attempt++) {
                try {
                    state.rev = Date.now();
                    var sentRev = state.rev;
                    var params = new URLSearchParams();
                    params.append('data', JSON.stringify(state));
                    await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params.toString() });
                    var snap = await fetchCloudSnapshot();
                    okSave = !!(snap && snap.rev === sentRev);
                } catch (e) { okSave = false; }
                if (!okSave) await new Promise(function(r) { setTimeout(r, 1500); });
            }
            if (okSave) { setSyncStatus('ok'); }
            else {
                setSyncStatus('error');
                showToast('⚠️ 保存を確認できませんでした。電波の良い場所で、記録の編集→保存をやり直してください');
            }
            _saveInFlight = false;
            if (_saveQueued) { _saveQueued = false; saveToCloud(); }
        }

        function resizeImage(file, maxWidth, quality) {
            maxWidth = maxWidth || 1200;
            quality = quality || 0.7;
            return new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function uploadImageToCloud(base64Data, uploadId) {
            return new Promise(async function(resolve, reject) {
                try {
                    var params = new URLSearchParams();
                    params.append('action', 'upload_image');
                    params.append('image', base64Data);
                    params.append('uploadId', uploadId);
                    await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params.toString() });
                } catch(e) { reject('送信失敗'); return; }
                var attempts = 0, maxAttempts = 60;
                var poll = function() {
                    var cbName = 'upChk_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
                    window[cbName] = function(data) {
                        delete window[cbName];
                        if (scr.parentNode) document.head.removeChild(scr);
                        if (data && data.status === 'done' && data.url) { resolve(data.url); }
                        else if (++attempts < maxAttempts) { setTimeout(poll, 1500); }
                        else { reject('タイムアウト'); }
                    };
                    var scr = document.createElement('script');
                    scr.src = GAS_URL + '?check_upload=' + encodeURIComponent(uploadId) + '&callback=' + cbName + '&t=' + Date.now();
                    scr.onerror = function() { delete window[cbName]; if (scr.parentNode) document.head.removeChild(scr); if (++attempts < maxAttempts) setTimeout(poll, 1500); else reject('通信エラー'); };
                    document.head.appendChild(scr);
                };
                setTimeout(poll, 2000);
            });
        }

        // pairs内の新規写真(base64)をDriveへアップロードし、保存用の配列に整形して返す
        async function uploadPairs(pairs, progressEl, btnEl) {
            var jobs = [];
            pairs.forEach(function(p, i) {
                ['before', 'after'].forEach(function(side) {
                    if (p[side] && p[side].data) jobs.push({ i: i, side: side });
                });
            });
            if (jobs.length > 0) {
                var msg = 'Before/After写真 ' + jobs.length + '枚を同時アップロード中...';
                if (progressEl) { progressEl.style.display = 'block'; progressEl.textContent = msg; }
                if (btnEl) btnEl.textContent = msg;
                // 全枚数を同時に送る（従来は1枚ずつ直列で、枚数分の待ち時間が足し算になっていた）
                await Promise.all(jobs.map(function(j, k) {
                    var uploadId = 'pair_' + Date.now() + '_' + k + '_' + Math.random().toString(36).slice(2, 6);
                    return uploadImageToCloud(pairs[j.i][j.side].data, uploadId)
                        .then(function(url) { pairs[j.i][j.side] = { url: url }; })
                        .catch(function() { showToast('Before/After写真のアップロードに失敗しました'); pairs[j.i][j.side] = null; });
                }));
            }
            return pairs
                .map(function(p) {
                    return { label: (p.label || '').trim(), before: p.before && p.before.url ? p.before.url : null, after: p.after && p.after.url ? p.after.url : null };
                })
                .filter(function(p) { return p.before || p.after; });
        }

                function cleanup() { delete window[cbName]; if (scr.parentNode) scr.parentNode.removeChild(scr); }
                var timer = setTimeout(function() { if (done) return; done = true; cleanup(); resolve(null); }, 20000);
                window[cbName] = function(d) {
                    if (done) return; done = true; clearTimeout(timer); cleanup();
                    resolve(d && d.b64 ? 'data:image/jpeg;base64,' + d.b64 : null);

                scr.src = GAS_URL + '?photo_b64=' + encodeURIComponent(url) + '&callback=' + cbName + '&t=' + Date.now();

        // PptxGenJS は必要になった時だけCDNから読み込む
        var _pptxLibLoading = null;
        function loadPptxLib() {
            if (window.PptxGenJS) return Promise.resolve();
            if (_pptxLibLoading) return _pptxLibLoading;
            _pptxLibLoading = new Promise(function(resolve, reject) {
                var s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
                s.onload = resolve;
                s.onerror = function() { _pptxLibLoading = null; reject(new Error('pptx lib load failed')); };
                document.head.appendChild(s);
            });
            return _pptxLibLoading;
        }

        // 写真をdataURLで取得。
        // drive.google.com/thumbnail はリダイレクト応答にCORSヘッダが無くブラウザから読めないため、
        // CORS許可(ACAO:*)のある lh3.googleusercontent.com/d/<id> 形式を最優先で使う（実測で確認済み）。
        // それも失敗したら元URL→GAS経由(JSONP)の順で試す。
        function fetchImageDataUrl(url) {
            var candidates = [];
            var m = String(url).match(/[?&]id=([^&]+)/);
            if (m) candidates.push('https://lh3.googleusercontent.com/d/' + m[1] + '=w800');
            candidates.push(url);
            var i = 0;
            function blobToDataUrl(b) {
                return new Promise(function(res) { var fr = new FileReader(); fr.onload = function() { res(fr.result); }; fr.readAsDataURL(b); });
            }
            function tryNext() {
                if (i >= candidates.length) return fetchViaGas();
                var u = candidates[i++];
                return fetch(u).then(function(r) { if (!r.ok) throw 0; return r.blob(); }).then(blobToDataUrl).catch(tryNext);
            }
            function fetchViaGas() {
                return new Promise(function(res, rej) {
                    var cb = 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5);
                    var s = document.createElement('script');
                    var timer = setTimeout(function() { cleanup(); rej(0); }, 20000);
                    function cleanup() { clearTimeout(timer); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
                    window[cb] = function(d) { cleanup(); if (d && d.b64) res('data:image/jpeg;base64,' + d.b64); else rej(0); };
                    s.src = GAS_URL + '?photo_b64=' + encodeURIComponent(url) + '&callback=' + cb;
                    s.onerror = function() { cleanup(); rej(0); };
                    document.head.appendChild(s);
                });
            }
            return tryNext();
        }

        var RP_NAVY = '1F4E79', RP_INK = '222222', RP_GRAY = '595959', RP_LINE = 'BFCBD9', RP_BG = 'EAF1F8';

        function rpHeader(slide, text) {
            slide.addShape('rect', { x: 0, y: 0, w: 10, h: 0.78, fill: { color: RP_NAVY } });
            slide.addText(text, { x: 0.35, y: 0, w: 9.3, h: 0.78, fontSize: 18, bold: true, color: 'FFFFFF', fontFace: 'Meiryo', valign: 'middle' });

        // 枠内に縦横比を保ったまま収める配置を計算する（縦写真は縦のまま中央寄せ）
        function rpFit(box, natW, natH) {
            var s = Math.min(box.w / natW, box.h / natH);
            var w = natW * s, h = natH * s;
            return { x: box.x + (box.w - w) / 2, y: box.y + (box.h - h) / 2, w: w, h: h };
        }

        async function generateReport() {

            var year = parseInt(m[1], 10), month = parseInt(m[2], 10);

                if (!r.pairs || r.pairs.length === 0) (r.photos || []).slice(0, 4).forEach(function(u) { urls.push(u); });
            });

        function buildReportHtml(recs, year, month, imgMap) {

            function img(url, w) {
                if (!url) return '';
                var src = imgMap[url] || url.replace('sz=w800', 'sz=w640');
                return '<img src="' + src + '" width="' + w + '" style="width:' + w + 'px;">';
            }
            var totalNobe = recs.reduce(function(s, r) { return s + (r.members ? r.members.length : 0); }, 0);
            var period = toWareki(year) + month + '月';

            var body = '';
            recs.forEach(function(r, idx) {
                var d = new Date(r.date + 'T00:00:00');
                var ds = year + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
                body += '<h3 style="font-size:12pt;border-left:6pt solid #0d9488;padding-left:8px;margin:18pt 0 6pt;">' + (idx + 1) + '．' + ds + '　' + esc(r.place) + '</h3>';
                body += '<table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:10.5pt;">' +
                    '<tr><td width="110" style="background:#f0f4f4;">実施日</td><td>' + ds + '</td></tr>' +
                    '<tr><td style="background:#f0f4f4;">場所</td><td>' + esc(r.place) + '</td></tr>' +
                    '<tr><td style="background:#f0f4f4;">作業内容</td><td>' + esc(r.work) + '</td></tr>' +
                    '<tr><td style="background:#f0f4f4;">参加人数</td><td>' + (r.members ? r.members.length : 0) + '名</td></tr>' +
                    (r.memo ? '<tr><td style="background:#f0f4f4;">特記事項</td><td>' + esc(r.memo) + '</td></tr>' : '') +
                    '</table>';
                (r.pairs || []).forEach(function(p) {
                    body += '<p style="margin:10pt 0 4pt;font-weight:bold;font-size:10.5pt;">' + (p.label ? '【' + esc(p.label) + '】' : '【作業前後の状況】') + '</p>' +
                        '<table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;font-size:10pt;text-align:center;">' +
                        '<tr><td width="260" style="background:#e8eef2;font-weight:bold;">Before（作業前）</td><td width="260" style="background:#e0f5f0;font-weight:bold;">After（作業後）</td></tr>' +
                        '<tr><td>' + (p.before ? img(p.before, 240) : '―') + '</td><td>' + (p.after ? img(p.after, 240) : '―') + '</td></tr>' +

        async function addRecord() {
            var date = document.getElementById('f-date').value;
            var place = document.getElementById('f-place').value.trim();
            var work = document.getElementById('f-work').value.trim();
            var memo = document.getElementById('f-memo').value.trim();
            var combustible = document.getElementById('f-combustible').value.trim();
            var soil = document.getElementById('f-soil').value.trim();
            var bags = document.getElementById('f-bags').value.trim();
            var area = document.getElementById('f-area').value.trim();
            var material = document.getElementById('f-material').value.trim();
            var weeding = document.getElementById('f-weeding').value.trim();
            var notice = document.getElementById('f-notice').value.trim();
            var members = [...document.querySelectorAll('#member-checkboxes input:checked')].map(function(c) { return c.value; });
            if (!date || !place || !work || members.length === 0) { showToast('日時・場所・メンバー・作業内容は必須です'); return; }

            // 記録は写真を待たずに先へ保存して画面を解放し、写真は裏で並列送信する
            var catSend = {};
            var photoCount = 0;
            PH_CATS.forEach(function(cat) { catSend[cat] = phPending(cat).filter(Boolean); photoCount += catSend[cat].length; });
            var pairsToSend = pendingPairs;
            var pairImgCount = 0;
            pairsToSend.forEach(function(p) {
                ['before', 'after'].forEach(function(side) { if (p[side] && p[side].data) pairImgCount++; });
            });
            var totalImgs = photoCount + pairImgCount;

            var record = { id: Date.now(), date: date, place: place, work: work, memo: memo, members: members };
            if (combustible) record.combustible = combustible;
            if (soil) record.soil = soil;
            if (bags) record.bags = bags;
            if (area) record.area = area;
            if (material) record.material = material;
            if (weeding) record.weeding = weeding;
            if (notice) record.notice = notice;
            state.records.unshift(record);

            // 押した瞬間に画面を返す：先にフォームを閉じてトーストを出し、
            // 重い一覧再描画とクラウド保存は直後のタイミングに回す
            ['f-date', 'f-place', 'f-work', 'f-memo', 'f-combustible', 'f-soil', 'f-bags', 'f-area', 'f-material', 'f-weeding', 'f-notice'].forEach(function(id) { document.getElementById(id).value = ''; });
            document.querySelectorAll('#member-checkboxes input').forEach(function(c) { c.checked = false; });
            pendingPhotos = []; pendingPhotosDone = []; pendingPhotosGov = [];
            PH_CATS.forEach(function(cat) { document.getElementById('f-photo-preview' + phSuffix(cat)).innerHTML = ''; });
            pendingPairs = [];
            renderPairRows('f');
            toggleAddForm();
            showToast(totalImgs > 0 ? '記録を追加しました！写真' + totalImgs + '枚は裏で送信中です' : '記録を追加しました！');
            setTimeout(function() { renderRecords(); updateHeaderCount(); saveToCloud(); }, 0);

            if (totalImgs === 0) return;
            bgUploadDelta(totalImgs);
            var catResults = { photos: [], photosDone: [], photosGov: [] };
            var photoJobs = [];
            PH_CATS.forEach(function(cat) {
                catSend[cat].forEach(function(data, i) {
                    var uploadId = 'img_' + Date.now() + '_' + cat + i + '_' + Math.random().toString(36).slice(2, 6);
                    photoJobs.push(uploadImageToCloud(data, uploadId)
                        .then(function(url) { catResults[cat].push(url); })
                        .catch(function() { /* 失敗分は枚数差で通知 */ })
                        .then(function() { bgUploadDelta(-1); }));
                });
            });
            var pairsDone = uploadPairs(pairsToSend, null, null)
                .then(function(cp) { bgUploadDelta(-pairImgCount); return cp; })
                .catch(function() { bgUploadDelta(-pairImgCount); return []; });
            Promise.all([Promise.all(photoJobs), pairsDone]).then(function(res) {
                var cleanPairs = res[1] || [];
                if (state.records.indexOf(record) === -1) return; // 送信中に記録が削除された場合は紐付けない
                var okCount = 0;
                PH_CATS.forEach(function(cat) {
                    okCount += catResults[cat].length;
                    if (catResults[cat].length > 0) record[cat] = catResults[cat];
                });
                if (cleanPairs.length > 0) record.pairs = cleanPairs;
                if (okCount > 0 || cleanPairs.length > 0) { saveToCloud(); renderRecords(); }
                var pairOk = cleanPairs.reduce(function(n, p) { return n + (p.before ? 1 : 0) + (p.after ? 1 : 0); }, 0);
                var failed = totalImgs - okCount - pairOk;
                showToast(failed > 0 ? '写真の送信が完了しました（' + failed + '枚は失敗）' : '写真の送信が完了しました');
            });
        }

        const WALKER_LEVELS = [
            { min: 0,   emoji: '🚶' }, // ふつうの歩き
            { min: 50,  emoji: '🚶‍♂️' }, // しっかり歩く
            { min: 100, emoji: '🏃' }, // ジョギング

            { min: 300, emoji: '🚴' }, // 自転車

            { min: 700, emoji: '👑' }, // 王者
            { min: 1000,emoji: '🌟' }, // レジェンド

        function getWalker(count) {
            var w = WALKER_LEVELS[0];
            for (var i = WALKER_LEVELS.length - 1; i >= 0; i--) {

        function renderRoadmap() {
            var area = document.getElementById('roadmap-area');
            if (!area) return;
            var now = new Date();
            var year = now.getFullYear();
            var startOfYear = new Date(year, 0, 1);
            var endOfYear = new Date(year + 1, 0, 1);
            var totalMs = endOfYear - startOfYear;
            var elapsedMs = now - startOfYear;
            var pct = Math.max(0, Math.min(100, (elapsedMs / totalMs) * 100));
            var monthsLeft = 11 - now.getMonth();
            var currentMonth = now.getMonth() + 1;
            var monthLabels = '';
            for (var m = 1; m <= 12; m++) {
                var cls = m < currentMonth ? 'past' : (m === currentMonth ? 'current' : '');
                monthLabels += '<span class="roadmap-month ' + cls + '">' + m + '</span>';
            }
            var statusText = monthsLeft === 0
                ? '今月で年末！'
                : '年末まで残り <strong>' + monthsLeft + 'ヶ月</strong>';
            area.innerHTML =
                '<div class="roadmap-card">' +
                  '<div class="roadmap-header">' +
                    '<div class="roadmap-title">🗺️ ' + year + '年のロードマップ</div>' +
                    '<div class="roadmap-status">' + currentMonth + '月｜年の' + Math.round(pct) + '%</div>' +
                  '</div>' +

                      '<div class="roadmap-progress" style="width:' + pct + '%"></div>' +

                      '<div class="roadmap-goal">🎉</div>' +

                    var all = catKept[cat].concat(catResults[cat]);
                    if (all.length > 0) record[cat] = all; else delete record[cat];
                });
                if (cleanPairs.length > 0) record.pairs = cleanPairs; else delete record.pairs;
                saveToCloud();
                renderRecords();
                if (totalImgs > 0) {
                    var failed = newCount - okCount;
                    showToast(failed > 0 ? '写真の送信が完了しました（' + failed + '枚は失敗）' : '写真の送信が完了しました');
                }
            });
        }

        function renderHeatmap(yr) {
            var area = document.getElementById('heatmap-area');
            var dateCounts = {};
            yr.forEach(function(r) {
                var ds = r.date.includes('T') ? r.date.split('T')[0] : r.date;
                dateCounts[ds] = (dateCounts[ds] || 0) + 1;
            });

            var now = new Date();
            var year = now.getFullYear();
            var months = [];
            for (var m = 0; m < 12; m++) {
                var weeks = [];
                var firstDay = new Date(year, m, 1);
                var lastDay = new Date(year, m + 1, 0);
                var currentWeek = [];
                // Pad start
                for (var pad = 0; pad < firstDay.getDay(); pad++) { currentWeek.push(null); }
                for (var d = 1; d <= lastDay.getDate(); d++) {
                    var dateStr = year + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                    var count = dateCounts[dateStr] || 0;
                    var lvl = count === 0 ? 0 : count === 1 ? 1 : count === 2 ? 2 : count <= 3 ? 3 : 4;
                    currentWeek.push(lvl);
                    if (currentWeek.length === 7) { weeks.push(currentWeek); currentWeek = []; }
                }
                if (currentWeek.length > 0) { while (currentWeek.length < 7) currentWeek.push(null); weeks.push(currentWeek); }
                months.push({ name: (m + 1) + '月', weeks: weeks });
            }

            var html = '<div class="heatmap-section"><div class="heatmap-title">活動カレンダー（' + year + '年）</div><div class="heatmap-months">';
            months.forEach(function(mo) {
                html += '<div class="heatmap-month"><div class="heatmap-month-label">' + mo.name + '</div><div class="heatmap-weeks">';
                mo.weeks.forEach(function(week) {
                    html += '<div class="heatmap-week">';
                    week.forEach(function(lvl) {
                        if (lvl === null) html += '<div class="heatmap-day" style="visibility:hidden;"></div>';
                        else html += '<div class="heatmap-day' + (lvl > 0 ? ' level-' + lvl : '') + '"></div>';
                    });
                    html += '</div>';
                });
                html += '</div></div>';
            });
            html += '</div>';
            html += '<div class="heatmap-legend">少ない <div class="heatmap-legend-box" style="background:var(--gray-200);"></div><div class="heatmap-legend-box" style="background:#bae6fd;"></div><div class="heatmap-legend-box" style="background:#38bdf8;"></div><div class="heatmap-legend-box" style="background:#0284c7;"></div><div class="heatmap-legend-box" style="background:#075985;"></div> 多い</div>';
            html += '</div>';
            area.innerHTML = html;
        }

            } else if (totalActivities < 30) {

            } else {
                messages.push('今年 <strong>' + totalActivities + '回</strong> の活動！CleanVibesの力で街が輝いています！');

            if (sorted.length > 0) {

                messages.push('<strong>' + topName + '</strong>さんが <strong>' + topCount + '回</strong> でトップを走っています！');
            }

            // Streak check
            var now = new Date();
            var recentWeeks = 0;
            for (var w = 0; w < 8; w++) {
                var weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() - (w * 7));
                var weekEnd = new Date(weekStart);
                weekEnd.setDate(weekEnd.getDate() + 6);
                var hasActivity = yr.some(function(r) {
                    var d = new Date(r.date);
                    return d >= weekStart && d <= weekEnd;
                });
                if (hasActivity) recentWeeks++;
                else break;
            }
            if (recentWeeks >= 3) {
                messages.push('<strong>' + recentWeeks + '週連続</strong>で活動中！素晴らしい継続力です！');
            }

            area.innerHTML = '<div class="encourage-section">' +

                '<div class="encourage-msg">' + messages.join('<br>') + '</div></div>';

        // 支援の集計（助成金 / 寄付金 / 物品応援 / 代表提供 / 行政支給）
        function getSupportTotals(year) {
            var supports = (state.supports || []).filter(function(s) {
                if (year == null) return true;
                return new Date(s.date + 'T00:00:00').getFullYear() === year;
            });
            var grant = 0, donation = 0, item = 0, rep = 0, gov = 0, donors = {};
            supports.forEach(function(s) {
                donors[s.name] = true;
                if (s.type === 'money') {
                    var amt = parseInt(s.value); if (isNaN(amt)) amt = 0;
                    if (s.category === '助成金') grant += amt; else donation += amt; // 既定は寄付金
                } else {
                    var mm = (s.memo || '').match(/[¥￥]\s*([\d,]+)/); // 備考の「相当額 ¥◯◯」から抽出
                    var iv = mm ? (parseInt(mm[1].replace(/,/g, ''), 10) || 0) : 0;
                    if (s.category === '代表提供') rep += iv;
                    else if (s.category === '行政支給') gov += iv;
                    else item += iv; // 既定は市民の物品応援
                }
            });
            return { donors: Object.keys(donors).length, count: supports.length, grant: grant, donation: donation, item: item, rep: rep, gov: gov, grand: grant + donation + item + rep + gov };
        }
