            var sorted = [...supports].sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
            listArea.innerHTML = sorted.map(function(s) {
                var d = new Date(s.date + 'T00:00:00');
                var ds = d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
                var icon = s.type === 'money' ? '💰' : '🎁';
                var amountClass = s.type === 'money' ? 'income' : 'item';
                var amountText = s.type === 'money' ? '¥' + parseInt(s.value).toLocaleString() : s.value;
                var deleteBtn = isAdmin ? '<button class="support-delete" onclick="deleteSupport(' + s.id + ')">✕</button>' : '';
                return '<div class="support-card">' +
                    '<div class="support-icon">' + icon + '</div>' +
                    '<div class="support-info"><div class="support-name">' + s.name + '</div>' +
                    (s.memo ? '<div class="support-detail">' + s.memo + '</div>' : '') +
                    '<div class="support-date">' + ds + '</div></div>' +
                    '<div class="support-amount ' + amountClass + '">' + amountText + '</div>' +
                    deleteBtn + '</div>';
            }).join('');
        }

        // ==========================================
        // ACCOUNTING (経理情報)
        // ==========================================
        async function addAccounting() {
            var date = document.getElementById('ac-date').value;
            var type = document.getElementById('ac-type').value;
            var amount = parseInt(document.getElementById('ac-amount').value);
            var category = document.getElementById('ac-category').value.trim();
            var memo = document.getElementById('ac-memo').value.trim();
            if (!date || isNaN(amount) || amount <= 0 || !category) { showToast('日付・金額・科目は必須です'); return; }
            if (!state.accounting) state.accounting = [];
            state.accounting.push({ id: Date.now(), date: date, type: type, amount: amount, category: category, memo: memo });
            await saveToCloud();
            renderAccounting();
            ['ac-date', 'ac-amount', 'ac-category', 'ac-memo'].forEach(function(id) { document.getElementById(id).value = ''; });
            showToast('収支を記録しました');
        }

        async function deleteAccounting(id) {
            if (!checkDeletePassword()) return;
            if (!confirm('この収支記録を削除しますか？')) return;
            state.accounting = state.accounting.filter(function(a) { return a.id !== id; });
            await saveToCloud();
            renderAccounting();
            showToast('収支記録を削除しました');
        }

        function setAccFilter(filter) {
            accFilter = filter;
            document.querySelectorAll('.accounting-filter button').forEach(function(btn) {
                btn.classList.toggle('active', btn.textContent === (filter === 'all' ? 'すべて' : filter === 'income' ? '収入のみ' : '支出のみ'));
            });
            renderAccounting();
        }

        function renderAccounting() {
            var accounting = state.accounting || [];
            var balanceArea = document.getElementById('accounting-balance-area');
            var tableArea = document.getElementById('accounting-table-area');

            // Balance
            var totalIncome = 0, totalExpense = 0;
            accounting.forEach(function(a) {
                if (a.type === 'income') totalIncome += a.amount;
                else totalExpense += a.amount;
            });
            var balance = totalIncome - totalExpense;
            balanceArea.innerHTML = '<div class="accounting-balance">' +
                '<div><div class="balance-label">現在の残高</div>' +
                '<div style="font-size:0.75rem;color:var(--gray-600);margin-top:2px;">収入 ¥' + totalIncome.toLocaleString() + ' ／ 支出 ¥' + totalExpense.toLocaleString() + '</div></div>' +
                '<div class="balance-amount" style="color:' + (balance >= 0 ? 'var(--green)' : 'var(--danger)') + '">¥' + balance.toLocaleString() + '</div></div>';

            // Filter
            var filtered = accounting;
            if (accFilter === 'income') filtered = accounting.filter(function(a) { return a.type === 'income'; });
            if (accFilter === 'expense') filtered = accounting.filter(function(a) { return a.type === 'expense'; });

            if (filtered.length === 0) {
                tableArea.innerHTML = '<div class="empty"><div class="empty-icon">💰</div><div class="empty-text">' +
                    (accounting.length === 0 ? 'まだ収支記録がありません' : '該当する記録がありません') + '</div></div>';
                return;
            }

            var sorted = [...filtered].sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
            var runningBalance = totalIncome - totalExpense;
            // Calculate running balance from oldest
            var allSorted = [...accounting].sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
            var balanceMap = {};
            var rb = 0;
            allSorted.forEach(function(a) {
                rb += (a.type === 'income' ? a.amount : -a.amount);
                balanceMap[a.id] = rb;
            });

            tableArea.innerHTML = '<table class="accounting-table"><thead><tr>' +
                '<th>日付</th><th>科目</th><th>摘要</th><th>収入</th><th>支出</th><th>残高</th>' +
                (isAdmin ? '<th></th>' : '') +
                '</tr></thead><tbody>' +
                sorted.map(function(a) {
                    var d = new Date(a.date + 'T00:00:00');
                    var ds = String(d.getMonth() + 1) + '/' + String(d.getDate());
                    var deleteBtn = isAdmin ? '<td><button class="support-delete" onclick="deleteAccounting(' + a.id + ')">✕</button></td>' : '';
                    return '<tr><td>' + ds + '</td><td>' + a.category + '</td><td>' + (a.memo || '-') + '</td>' +
                        '<td class="amount-in">' + (a.type === 'income' ? '¥' + a.amount.toLocaleString() : '') + '</td>' +
                        '<td class="amount-out">' + (a.type === 'expense' ? '¥' + a.amount.toLocaleString() : '') + '</td>' +
                        '<td>¥' + (balanceMap[a.id] || 0).toLocaleString() + '</td>' +
                        deleteBtn + '</tr>';
                }).join('') + '</tbody></table>';
        }

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(function() { t.classList.remove('show'); }, 2500);
        }

        // ==========================================
        // AUTO SYNC
        // ==========================================
        setInterval(function() {
            var callbackName = 'gasRefresh_' + Date.now();
            window[callbackName] = function(remote) {
                try {
                    if (remote && Array.isArray(remote.records) && JSON.stringify(remote) !== JSON.stringify(state)) {
                        if (!remote.supports) remote.supports = [];
                        if (!remote.accounting) remote.accounting = [];
                        state = remote;
                        renderAll();
                        showToast('データを更新しました');
                    }
                } catch(e) {}
                if (script.parentNode) document.head.removeChild(script);
                delete window[callbackName];
            };
            var script = document.createElement('script');
            script.src = GAS_URL + '?callback=' + callbackName + '&t=' + Date.now();
            script.onerror = function() { if (script.parentNode) document.head.removeChild(script); delete window[callbackName]; };
            document.head.appendChild(script);
        }, 30000);

        loadFromCloud();
    </script>
</body>
</html>
